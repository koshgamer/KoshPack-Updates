name: Publish Meridian Quests UI DEV asset

on:
  push:
    branches:
      - main
    paths:
      - "launcher/dev/meridian_quests_ui-dev.jar"
      - ".github/workflows/publish-meridian-quests-ui.yml"

permissions:
  contents: write

concurrency:
  group: dev-manifest-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inspect Meridian Quests UI jar
        run: |
          set -euo pipefail
          JAR="launcher/dev/meridian_quests_ui-dev.jar"
          test -f "$JAR"
          echo "SIZE=$(stat -c%s "$JAR")" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$JAR" | awk '{print $1}')" >> "$GITHUB_ENV"
          test "$(stat -c%s "$JAR")" -gt 1000

      - name: Upload to public DEV release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload armor-dev-current launcher/dev/meridian_quests_ui-dev.jar \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep DEV manifest synchronized
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("launcher/dev-manifest.json")
          data = json.loads(p.read_text("utf-8"))

          rel = "mods/meridian_quests_ui-dev.jar"
          entry = {
              "path": rel,
              "url": "https://raw.githubusercontent.com/koshgamer/KoshPack-Updates/main/launcher/dev/meridian_quests_ui-dev.jar",
              "size": int(os.environ["SIZE"]),
              "sha256": os.environ["SHA256"],
          }

          extras = [e for e in data.get("extras", []) if e.get("path") != rel]
          extras.append(entry)
          data["extras"] = extras
          data["hotfixRevision"] = int(data.get("hotfixRevision", 0)) + 1

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", "utf-8")
          PY

      - name: Commit manifest if needed
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/dev-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already current."
            exit 0
          fi
          git commit -m "dev: sync Meridian Quests UI launcher feed"
          git pull --rebase origin main
          git push origin HEAD:main
