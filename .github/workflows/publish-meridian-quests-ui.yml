name: Publish Meridian Quests UI DEV asset

on:
  push:
    branches:
      - main
    paths:
      - "launcher/dev/meridian_quests_ui-dev.jar.b64"
      - ".github/workflows/publish-meridian-quests-ui.yml"

permissions:
  contents: write

concurrency:
  group: dev-manifest-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode Meridian Quests UI jar
        run: |
          tr -d '\r\n' < launcher/dev/meridian_quests_ui-dev.jar.b64 | base64 -d > meridian_quests_ui-dev.jar
          echo "SIZE=$(stat -c%s meridian_quests_ui-dev.jar)" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum meridian_quests_ui-dev.jar | awk '{print $1}')" >> "$GITHUB_ENV"
          test "$(stat -c%s meridian_quests_ui-dev.jar)" -gt 1000

      - name: Upload to public DEV release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload armor-dev-current meridian_quests_ui-dev.jar --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add Meridian Quests UI to DEV manifest
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("launcher/dev-manifest.json")
          data = json.loads(p.read_text("utf-8"))

          rel = "mods/meridian_quests_ui-dev.jar"
          entry = {
              "path": rel,
              "url": "https://github.com/koshgamer/KoshPack-Updates/releases/download/armor-dev-current/meridian_quests_ui-dev.jar",
              "size": int(os.environ["SIZE"]),
              "sha256": os.environ["SHA256"],
          }

          extras = [e for e in data.get("extras", []) if e.get("path") != rel]
          extras.append(entry)
          data["extras"] = extras
          data["hotfixRevision"] = max(int(data.get("hotfixRevision", 0)) + 1, 49)

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", "utf-8")
          print("Published", rel, entry["size"], entry["sha256"])
          print("hotfixRevision", data["hotfixRevision"])
          PY

      - name: Commit manifest
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/dev-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already current."
            exit 0
          fi
          git commit -m "dev: add Meridian Quests UI to launcher feed"
          git pull --rebase origin main
          git push origin HEAD:main
