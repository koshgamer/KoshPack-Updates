name: Sync DEV Armor alpha49

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-dev-armor-alpha49.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout updates repo
        uses: actions/checkout@v4

      - name: Download alpha49 from KoshPack-DEV
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/koshgamer/KoshPack-DEV/armor-shooter-progression-v3/armor-dev/output49/KoshPack_Armor_alpha49_shooter_progression_v3.jar.b64"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o launcher/dev/current.jar.b64
          test -s launcher/dev/current.jar.b64
          base64 -d launcher/dev/current.jar.b64 > /tmp/KoshPack_Armor_DEV.jar
          test "$(stat -c%s /tmp/KoshPack_Armor_DEV.jar)" -eq 864733
          echo "1b696a0ebb95136065adb0b95e41bb8d21a0d48a0eadadfde279b7f9d36025d3  /tmp/KoshPack_Armor_DEV.jar" | sha256sum -c -
          jar tf /tmp/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/armor/client/ShooterModelGeometry.class'
          jar tf /tmp/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_shooter_test.mcfunction'

      - name: Commit synced DEV payload
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/dev/current.jar.b64
          git diff --cached --quiet && exit 0
          git commit -m "armor: sync alpha49 Shooter progression v3"
          git push
