name: Publish Forge UI DEV

on:
  push:
    branches: [ main ]
    paths:
      - 'launcher/dev/forge-ui.jar.b64'
      - '.github/workflows/publish-forge-ui-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-ui-dev-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decode Forge UI
        run: |
          set -e
          mkdir -p dist
          base64 -d launcher/dev/forge-ui.jar.b64 > dist/KoshPack_Forge_UI_DEV.jar
          unzip -t dist/KoshPack_Forge_UI_DEV.jar >/dev/null
          jar tf dist/KoshPack_Forge_UI_DEV.jar | grep -q 'ru/koshpack/forgeui/client/ForgeBenchScreen.class'
          jar tf dist/KoshPack_Forge_UI_DEV.jar | grep -q 'ru/koshpack/forgeui/forge/ForgeService.class'
          jar tf dist/KoshPack_Forge_UI_DEV.jar | grep -q 'data/koshpack_forge_ui/forge_modifiers.json'

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="forge-ui-dev-current"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KoshPack_Forge_UI_DEV.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/KoshPack_Forge_UI_DEV.jar --repo "$GITHUB_REPOSITORY" --title "KoshPack Forge UI DEV" --notes "Native Forge Bench UI for the DEV channel." --latest=false
          fi

