name: Inspect Create Mob Farming internals

on:
  push:
    branches: [main]
    paths:
      - ".github/inspect-mob-farming-internals-trigger"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Inspect upstream JAR
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edge.forgecdn.net/files/8914/259/createmobfarming-1.1.0.jar"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o mod.jar

          echo "=== SERVER CONFIG ==="
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.config.CMFServerConfig

          echo "=== OBSERVER ==="
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.entityobserver.EntityObserverBlockEntity
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.entityobserver.EntityObserverScan

          echo "=== BLADE ==="
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.mechanicalblade.BladeDamage
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.mechanicalblade.BladeExperience
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.mechanicalblade.BladeAttackService

          echo "=== CRITTERPORT ==="
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.critterport.CritterportBlockEntity
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.critterport.CritterportRouting

          echo "=== GATE ==="
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.mobgate.MobGateBlockEntity

          echo "=== FILTER ==="
          javap -classpath mod.jar -p -c com.ethane.createmobfarming.content.entityfilter.EntityFilter

          echo "=== TAG VALUES ==="
          for f in             data/createmobfarming/tags/entity_type/critterport_immune.json             data/createmobfarming/tags/entity_type/mechanical_blade_bosses.json             data/createmobfarming/tags/entity_type/mechanical_blade_immune.json             data/createmobfarming/tags/enchantment/mechanical_blade_supported.json             data/create/tags/block/fan_transparent.json             data/create/tags/item/contraption_controlled.json; do
            echo "--- $f"
            unzip -p mod.jar "$f" || true
            echo
          done

          echo "=== RECIPES ==="
          for f in data/createmobfarming/recipe/*.json; do :; done
          for f in $(jar tf mod.jar | grep '^data/createmobfarming/recipe/.*\.json$'); do
            echo "--- $f"
            unzip -p mod.jar "$f"
            echo
          done
