name: Publish Stable pack with steel casting recipes (steelcast1)

# Adds only kubejs/data/koshpack/recipe/casting/steel_*.json to the public Stable client pack: Productive
# Metalworks molten steel had no casting output in this pack (all upstream casts need absent mods), so the
# Foundry steel route was a dead end. Publishes a new immutable pack release with its per-file index, verifies
# live HTTP ranges, and only then points launcher/manifest.json at it. Servers need the same files in kubejs/.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/steel-casting-stable-trigger"

permissions:
  contents: write

concurrency:
  group: meridian-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_PACK: stable-r2j-menu2-mobfarming1-zoom1-armorfix1-savanna1-coating1-pipesfix1
      SUFFIX: steelcast1
      FILES_DIR: files/steel-casting1
    steps:
      - uses: actions/checkout@v4

      - name: Launcher incremental tests
        run: python launcher/tests/test_incremental.py

      - name: Download current Stable pack and index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_ZIP=$(python -c "import json;print(json.load(open('launcher/manifest.json'))['package']['file'])")
          BASE_INDEX=$(python -c "import json;print(json.load(open('launcher/manifest.json'))['fileIndex']['url'].rsplit('/',1)[1])")
          echo "BASE_ZIP=$BASE_ZIP" >> "$GITHUB_ENV"
          echo "BASE_INDEX=$BASE_INDEX" >> "$GITHUB_ENV"
          mkdir -p .out/base
          gh release download "pack-$BASE_PACK" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_ZIP" --pattern "$BASE_INDEX" --dir .out/base

      - name: Patch pack, build index and manifest
        run: |
          set -euo pipefail
          python tools/pack/add_stable_files.py patch launcher/manifest.json \
            ".out/base/$BASE_ZIP" ".out/base/$BASE_INDEX" "$FILES_DIR" "$BASE_PACK" "$SUFFIX" .out/new
          echo "TAG=$(cat .out/new/tag.txt)" >> "$GITHUB_ENV"

      - name: Publish new immutable pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published pack bytes must not be overwritten." >&2
            exit 1
          fi
          mapfile -t ASSETS < .out/new/assets.txt
          gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "Project Meridian Stable r2j — Steel casting" \
            --notes "Stable client pack: adds Productive Metalworks casting recipes for molten steel (ingot cast -> Create Big Cannons steel ingot, nugget cast -> steel scrap, plate cast -> steel sheet, block casting -> steel block). All other files are unchanged; launchers fetch only these four JSON files. Servers need the same files in kubejs/data/koshpack/recipe/casting/." \
            --latest=false

      - name: Verify live per-file download
        run: python tools/pack/add_stable_files.py verify .out/new

      - name: Publish manifest only after the pack is live
        run: |
          set -euo pipefail
          cp .out/new/manifest.json launcher/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "stable: steel casting recipes in public pack [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
