name: Publish DEV Armor

on:
  push:
    branches:
      - main
    paths:
      - "launcher/dev/current.jar.b64"
      - "launcher/dev-manifest.json"
      - ".github/workflows/publish-dev-armor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-armor-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode DEV armor
        run: |
          mkdir -p dist
          base64 -d launcher/dev/current.jar.b64 > dist/KoshPack_Armor_DEV.jar
          echo "SHA256=$(sha256sum dist/KoshPack_Armor_DEV.jar | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c%s dist/KoshPack_Armor_DEV.jar)" >> "$GITHUB_ENV"

      - name: Read and validate DEV manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path("launcher/dev-manifest.json").read_text(encoding="utf-8"))
          armor = data["armor"]
          size = int(os.environ["SIZE"])
          sha = os.environ["SHA256"]

          assert data["channel"] == "dev-armor"
          assert data["minecraft"] == "1.21.1"
          assert data["neoforge"] == "21.1.248"
          assert armor["file"] == "KoshPack_Armor_DEV.jar"
          assert int(armor["size"]) == size, (armor["size"], size)
          assert armor["sha256"] == sha, (armor["sha256"], sha)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f'DEV_VERSION={armor["version"]}\n')
              note = str(armor.get("note", "")).replace("\n", " ")
              env.write(f'DEV_NOTE={note}\n')
          print("Publishing", armor["version"])
          PY

      - name: Verify expected build
        run: |
          test "$SIZE" -gt "100000"
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/armor/client/DiverModelGeometry.class'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_armor_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/hunterarmor/HunterArmorAddon.class'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_hunter_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/artilleryarmor/ArtilleryArmorAddon.class'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_artillery_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_diver_test.mcfunction'

      - name: Publish DEV release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="armor-dev-current"
          cp launcher/dev-manifest.json dist/dev-manifest.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KoshPack_Armor_DEV.jar dist/dev-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/KoshPack_Armor_DEV.jar dist/dev-manifest.json               --repo "$GITHUB_REPOSITORY"               --title "Project Meridian DEV Armor"               --notes "Автоматический DEV-канал тестовой брони Project Meridian."               --latest=false
          fi

      - name: Summary
        run: |
          echo "Published $DEV_VERSION"
          echo "$DEV_NOTE"
