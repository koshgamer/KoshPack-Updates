name: Build Artillery alpha53

on:
  push:
    branches: [main]
    paths:
      - "tools/armor/build_artillery_alpha53.py"
      - ".github/workflows/build-artillery-alpha53.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artillery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build Artillery DEV armor
        run: python tools/armor/build_artillery_alpha53.py

      - name: Verify Artillery JAR
        run: |
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/artilleryarmor/ArtilleryArmorAddon.class'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/armor/client/ArtilleryModelGeometry.class'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_artillery_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_hunter_test.mcfunction'
          javap -classpath dist/KoshPack_Armor_DEV.jar -c -p ru.koshpack.forgebridge.armor.KoshPackArmorMod | grep -q 'artilleryarmor/ArtilleryArmorAddon'
          test "$(stat -c%s dist/KoshPack_Armor_DEV.jar)" -gt 1000000

      - name: Publish DEV release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/dev-manifest.json dist/dev-manifest.json
          gh release upload armor-dev-current dist/KoshPack_Armor_DEV.jar dist/dev-manifest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Commit DEV payload
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/dev/current.jar.b64 launcher/dev-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "armor: publish alpha53 Artillery crew to DEV channel"
          git push
