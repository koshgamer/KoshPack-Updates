name: Build Diver alpha54

on:
  push:
    branches:
      - main
    paths:
      - "tools/armor/diver_v2/**"
      - "tools/armor/build_diver_alpha54.py"
      - ".github/workflows/build-diver-alpha54.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-diver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Compile Diver geometry against Minecraft API signatures
        shell: bash
        run: |
          set -e
          STUB=/tmp/kosh-diver-stubs
          OUT=tools/armor/diver_v2/build/classes/java/main
          rm -rf "$STUB" "$OUT"
          mkdir -p             "$STUB/net/minecraft/client/model"             "$STUB/net/minecraft/client/model/geom"             "$STUB/net/minecraft/client/model/geom/builders"             "$STUB/net/minecraft/world/entity"             "$OUT"

          cat > "$STUB/net/minecraft/client/model/HumanoidModel.java" <<'JAVA'
          package net.minecraft.client.model;
          import net.minecraft.client.model.geom.builders.CubeDeformation;
          import net.minecraft.client.model.geom.builders.MeshDefinition;
          public class HumanoidModel<T> {
              public static MeshDefinition createMesh(CubeDeformation deformation, float yOffset) { return null; }
          }
          JAVA

          cat > "$STUB/net/minecraft/client/model/geom/PartPose.java" <<'JAVA'
          package net.minecraft.client.model.geom;
          public class PartPose {
              public static final PartPose ZERO = new PartPose();
              public static PartPose offset(float x, float y, float z) { return null; }
              public static PartPose offsetAndRotation(float x, float y, float z, float xr, float yr, float zr) { return null; }
          }
          JAVA

          cat > "$STUB/net/minecraft/client/model/geom/builders/CubeDeformation.java" <<'JAVA'
          package net.minecraft.client.model.geom.builders;
          public class CubeDeformation {
              public CubeDeformation(float grow) {}
          }
          JAVA

          cat > "$STUB/net/minecraft/client/model/geom/builders/CubeListBuilder.java" <<'JAVA'
          package net.minecraft.client.model.geom.builders;
          public class CubeListBuilder {
              public static CubeListBuilder create() { return null; }
              public CubeListBuilder texOffs(int u, int v) { return this; }
              public CubeListBuilder mirror() { return this; }
              public CubeListBuilder mirror(boolean value) { return this; }
              public CubeListBuilder addBox(float x, float y, float z, float dx, float dy, float dz, CubeDeformation deformation) { return this; }
          }
          JAVA

          cat > "$STUB/net/minecraft/client/model/geom/builders/LayerDefinition.java" <<'JAVA'
          package net.minecraft.client.model.geom.builders;
          public class LayerDefinition {
              public static LayerDefinition create(MeshDefinition mesh, int width, int height) { return null; }
          }
          JAVA

          cat > "$STUB/net/minecraft/client/model/geom/builders/MeshDefinition.java" <<'JAVA'
          package net.minecraft.client.model.geom.builders;
          public class MeshDefinition {
              public PartDefinition getRoot() { return null; }
          }
          JAVA

          cat > "$STUB/net/minecraft/client/model/geom/builders/PartDefinition.java" <<'JAVA'
          package net.minecraft.client.model.geom.builders;
          import net.minecraft.client.model.geom.PartPose;
          public class PartDefinition {
              public PartDefinition addOrReplaceChild(String name, CubeListBuilder cubes, PartPose pose) { return null; }
          }
          JAVA

          cat > "$STUB/net/minecraft/world/entity/EquipmentSlot.java" <<'JAVA'
          package net.minecraft.world.entity;
          public final class EquipmentSlot {
              public static final EquipmentSlot HEAD = new EquipmentSlot();
              public static final EquipmentSlot CHEST = new EquipmentSlot();
              public static final EquipmentSlot LEGS = new EquipmentSlot();
              public static final EquipmentSlot FEET = new EquipmentSlot();
          }
          JAVA

          javac --release 21             -d "$OUT"             $(find "$STUB" -name '*.java' -print)             tools/armor/diver_v2/src/main/java/ru/koshpack/forgebridge/armor/client/DiverModelGeometry.java

          test -s "$OUT/ru/koshpack/forgebridge/armor/client/DiverModelGeometry.class"
          javap -classpath "$OUT" -verbose ru.koshpack.forgebridge.armor.client.DiverModelGeometry             | grep -q 'deep_sea_dome_iv'

      - name: Patch current DEV armor
        run: python tools/armor/build_diver_alpha54.py

      - name: Verify alpha54 payload
        run: |
          set -e
          unzip -t dist/KoshPack_Armor_DEV.jar >/dev/null

          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'ru/koshpack/forgebridge/armor/client/DiverModelGeometry.class'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_diver_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_hunter_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'data/koshpackarmor/function/spawn_artillery_test.mcfunction'
          jar tf dist/KoshPack_Armor_DEV.jar | grep -q 'META-INF/koshpack/diver-alpha54-donor.txt'

          javap -classpath dist/KoshPack_Armor_DEV.jar -verbose             ru.koshpack.forgebridge.armor.client.DiverModelGeometry             | grep -q 'deep_sea_dome_iv'
          javap -classpath dist/KoshPack_Armor_DEV.jar -verbose             ru.koshpack.forgebridge.armor.client.DiverModelGeometry             | grep -q 'tiny_tank_i'
          javap -classpath dist/KoshPack_Armor_DEV.jar -verbose             ru.koshpack.forgebridge.armor.client.DiverModelGeometry             | grep -q 'right_long_fin_iii'

          for TIER in i ii iii iv; do
            for PIECE in helmet chestplate leggings boots; do
              jar tf dist/KoshPack_Armor_DEV.jar                 | grep -q "assets/koshpackdiverhelmet/textures/models/armor/diver_${PIECE}_${TIER}.png"
            done
          done

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          jar = Path("dist/KoshPack_Armor_DEV.jar").read_bytes()
          m = json.loads(Path("launcher/dev-manifest.json").read_text(encoding="utf-8"))
          assert m["armor"]["version"] == "alpha54-diver-v2-donor-rebuild"
          assert m["armor"]["size"] == len(jar)
          assert m["armor"]["sha256"] == hashlib.sha256(jar).hexdigest()
          print("manifest OK")
          PY

      - name: Publish alpha54 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/dev-manifest.json dist/dev-manifest.json
          gh release upload armor-dev-current             dist/KoshPack_Armor_DEV.jar             dist/dev-manifest.json             --clobber             --repo "$GITHUB_REPOSITORY"

      - name: Commit alpha54 DEV payload
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/dev/current.jar.b64 launcher/dev-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "armor: publish alpha54 donor-based Diver rebuild"
          git push
