name: Sync DEV crafting extras manifest
# forge-v0.1-final-sync

on:
  push:
    branches:
      - main
    paths:
      - "launcher/dev/extras/**"
      - ".github/workflows/sync-dev-crafting-extras.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update DEV manifest extras
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          repo = "koshgamer/KoshPack-Updates"
          manifest_path = Path("launcher/dev-manifest.json")
          data = json.loads(manifest_path.read_text("utf-8"))

          entries = []
          rels = [
              "kubejs/startup_scripts/koshpack_profession_armor_components.js",
              "kubejs/server_scripts/koshpack_profession_armor_crafting.js",
              "kubejs/server_scripts/koshpack_profession_armor_traits.js",
              "kubejs/client_scripts/koshpack_profession_armor_trait_tooltips.js",
              "kubejs/startup_scripts/koshpack_forge_bench.js",
              "kubejs/server_scripts/koshpack_forge_bench_recipes.js",
              "kubejs/server_scripts/koshpack_forge_bench.js",
              "kubejs/server_scripts/koshpack_forge_test_kit.js",
              "kubejs/server_scripts/koshpack_forge_runtime.js",
              "kubejs/client_scripts/koshpack_forge_tooltips.js",
              "kubejs/client_scripts/koshpack_gear_readable_tooltips.js",
              "kubejs/server_scripts/koshpack_gear_material_swap.js",
              "kubejs/server_scripts/koshpack_alloy_progression.js",
              "kubejs/client_scripts/koshpack_alloy_tooltips.js",
          ]
          for rel in rels:
              src = Path("launcher/dev/extras") / rel
              payload = src.read_bytes()
              entries.append({
                  "path": rel,
                  "url": f"https://raw.githubusercontent.com/{repo}/main/launcher/dev/extras/{rel}",
                  "size": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              })

          data["channel"] = "dev-armor"
          # Do not overwrite armor version/note here: the integrated armor/GUI
          # publisher owns those fields. This workflow only refreshes extras.
          data["extras"] = entries
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", "utf-8")
          PY

      - name: Commit manifest
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/dev-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "dev: publish profession armor crafting extras manifest"
          git pull --rebase origin main
          git push origin HEAD:main
