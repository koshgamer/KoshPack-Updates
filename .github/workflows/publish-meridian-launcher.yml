name: Publish Project Meridian Launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/source/**'
      - 'launcher/tests/**'
      - 'launcher/build/**'
      - 'launcher/tools/**'
      - '.github/workflows/publish-meridian-launcher.yml'
permissions:
  contents: write
concurrency:
  group: meridian-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3 'pillow>=10,<13'
      - name: Functional tests
        run: |
          python -m unittest discover -s launcher/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher/tests/test_public_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher/source/launcher.py --smoke-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build folder bundle and EXE installer
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          launcher/build/build_windows.ps1
      - name: Test frozen self-update and independent game monitoring
        shell: powershell
        run: |
          launcher/tests/test_frozen_self_update.ps1
          launcher/tests/test_frozen_game_session.ps1
          launcher/tests/test_update_recovery.ps1
          launcher/tests/test_installer.ps1
      - name: Save tested release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meridian-launcher-windows
          path: |
            dist/Project-Meridian-Launcher.exe
            dist/Project-Meridian-Launcher-*-win64.zip
            dist/SHA256SUMS.txt
            .out/launcher-build.json
      - name: Publish immutable launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $build = Get-Content .out/launcher-build.json -Raw | ConvertFrom-Json
          $version = $build.version
          $tag = "launcher-$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Launcher version already published. Increment APP_VERSION.' }
          $bundle = Join-Path dist $build.bundle.file
          gh release create $tag dist/Project-Meridian-Launcher.exe $bundle dist/SHA256SUMS.txt --title "Project Meridian Launcher $version" --notes 'Windows installer, verified whole-folder self-update, close after successful Minecraft startup, resumable per-file pack updates.' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Versioned release failed' }
      - name: Verify remote artifacts and publish only launcher metadata
        run: |
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not read current manifest' }
          python launcher/tools/publish_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest validation failed' }
          git config user.name 'Project Meridian CI'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/manifest.json
          git commit -m 'release: verified Windows launcher installer'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Manifest publication failed' }
      - name: Update compatible download alias after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload launcher-current dist/Project-Meridian-Launcher.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Current installer alias upload failed' }
