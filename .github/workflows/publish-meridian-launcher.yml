name: Publish Project Meridian Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launcher/source/**"
      - ".github/workflows/publish-meridian-launcher.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile launcher/source/launcher.py launcher/source/make_icon.py

      - name: Generate Project Meridian icon
        shell: pwsh
        run: |
          python launcher/source/make_icon.py

      - name: Smoke-test UI
        shell: pwsh
        run: |
          python launcher/source/launcher.py --smoke-ui

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon launcher/meridian.ico --name Project-Meridian-Launcher launcher/source/launcher.py

      - name: Publish stable launcher asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "launcher-current"
          $asset = "dist/Project-Meridian-Launcher.exe"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title "Project Meridian Launcher" --notes "Актуальная публичная версия Project Meridian Launcher для Windows." --latest=false
          }

      - name: Update launcher manifest
        shell: pwsh
        run: |
          $asset = "dist/Project-Meridian-Launcher.exe"
          $sha = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $asset).Length
          $versionMatch = Select-String -Path "launcher/source/launcher.py" -Pattern 'APP_VERSION = "([^"]+)"'
          $version = $versionMatch.Matches[0].Groups[1].Value
          $manifest = Get-Content "launcher/manifest.json" -Raw | ConvertFrom-Json
          $manifest.launcher.version = $version
          $manifest.launcher.url = "https://github.com/koshgamer/KoshPack-Updates/releases/download/launcher-current/Project-Meridian-Launcher.exe"
          $manifest.launcher.sha256 = $sha
          $manifest.launcher.size = [int64]$size
          $json = $manifest | ConvertTo-Json -Depth 20
          [System.IO.File]::WriteAllText((Resolve-Path "launcher/manifest.json"), $json + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

      - name: Commit launcher manifest
        shell: pwsh
        run: |
          git config user.name "Project Meridian CI"
          git config user.email "actions@users.noreply.github.com"
          git add launcher/manifest.json
          if (git diff --cached --quiet) {
            Write-Host "Launcher manifest already current."
            exit 0
          }
          git commit -m "launcher: publish current Windows build"
          git pull --rebase origin main
          git push origin HEAD:main
